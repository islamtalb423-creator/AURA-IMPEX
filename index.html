<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA IMPEX</title>
<style>
:root{--bg:#090909;--panel:#151515;--text:#f6f0e4;--muted:#aaa18f;--gold:#c9a45c;--line:#332b1e}
body.light{--bg:#f7f4ed;--panel:#fff;--text:#19150d;--muted:#706858;--line:#e4dac8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Tahoma,Arial,sans-serif;line-height:1.6}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:3;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:2px;color:var(--gold);font-size:22px}.tools{display:flex;gap:8px;align-items:center}
button,select{font:inherit;cursor:pointer;border:1px solid var(--gold);border-radius:8px;padding:8px 12px;background:transparent;color:var(--text)}
select option{color:#111}.gold{background:var(--gold);color:#111;font-weight:bold;border:0}
#cartBtn{display:inline-flex;align-items:center;gap:6px}#cartBtn svg{width:20px;height:20px}
main{max-width:1100px;margin:auto;padding:24px 5%}
.hero{border:1px solid var(--line);border-radius:18px;padding:34px 24px;background:linear-gradient(125deg,#211b10,#090909);margin:18px 0 28px}
body.light .hero{background:linear-gradient(125deg,#efe2c3,#fff)}
.hero small{color:var(--gold);letter-spacing:2px}.hero h1{font-size:clamp(28px,5vw,48px);margin:8px 0}.hero p{color:var(--muted);max-width:650px}
h2{color:var(--gold);margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.visual{height:230px;background:#fff;display:grid;place-items:center}
.visual img{width:100%;height:100%;object-fit:contain;padding:12px;display:block}
.info{padding:16px;display:flex;flex-direction:column;flex:1}.tag{color:var(--gold);font-size:13px}.price{font-size:24px;color:var(--gold);font-weight:bold}.muted{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:14px;align-items:center}.actions button{flex:1}
#cart{position:fixed;inset:0;background:#0009;display:none;z-index:5;align-items:center;justify-content:center;padding:15px}
#cart.open{display:flex}.modal{background:var(--panel);border:1px solid var(--gold);border-radius:15px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto}
.modal h2{margin-top:0}.close{float:left}
.cartline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cartline img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.cartline .nm{flex:1;font-size:14px}
.qtybox{display:flex;align-items:center;gap:6px}.qtybox button{padding:2px 9px;line-height:1.3}
footer{text-align:center;color:var(--muted);padding:30px 12px;border-top:1px solid var(--line);margin-top:40px}
a{color:var(--gold)}.notice{border:1px solid var(--line);padding:12px;border-radius:10px;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="logo">AURA IMPEX</div>
  <div class="tools">
    <select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
    <button id="theme" aria-label="Theme">◐</button>
    <button id="cartBtn" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span id="cartCount">0</span>
    </button>
  </div>
</header>
<main>
  <section class="hero">
    <small data-i18n="eyebrow"></small>
    <h1 data-i18n="headline"></h1>
    <p data-i18n="subhead"></p>
  </section>
  <h2 data-i18n="sectionTitle"></h2>
  <section class="grid" id="products"></section>
  <div class="notice" data-i18n="notice"></div>
</main>
<footer>© 2026 AURA IMPEX</footer>
<div id="cart">
  <div class="modal">
    <button class="close" id="close">✕</button>
    <h2 data-i18n="cartTitle"></h2>
    <div id="cartLines"></div>
    <p><strong data-i18n="totalLabel"></strong> <span class="price" id="total">$0.00</span></p>
    <p class="muted" data-i18n="cartNote"></p>
    <button class="gold" id="continue" data-i18n="continue"></button>
  </div>
</div>
<script>
/* ============ المنتجات / PRODUCTS ============
   لإضافة منتج جديد: انسخ كتلة {...} كاملة وضعها بعد الأخيرة (لا تنس الفاصلة).
   الصورة: رابط خارجي، أو مسار ملف داخل المستودع مثل "images/product2.jpg"
*/
const products=[
  {
    id:"car-holder-360",
    img:"https://images.nexusapp.co/assets/cd/9a/40/369494180.jpg",
    price:3.99,
    supplier:"https://www.aliexpress.com/item/1005013105947959.html",
    tag:{ar:"إكسسوارات السيارات",en:"Car accessories",fr:"Accessoires auto"},
    name:{ar:"حامل هاتف للسيارة 360°",en:"360° Car Phone Holder",fr:"Support téléphone voiture 360°"},
    desc:{
      ar:"حامل هاتف قابل للدوران 360 درجة لتثبيت الهاتف داخل السيارة وضبط زاوية الرؤية.",
      en:"A rotating 360-degree phone holder for use inside your car, with an adjustable viewing angle.",
      fr:"Support de téléphone rotatif à 360° pour voiture, avec angle de vision réglable."
    }
  }
  /* ,{
    id:"product-2",
    img:"images/product2.jpg",
    price:0.00,
    supplier:"",
    tag:{ar:"",en:"",fr:""},
    name:{ar:"",en:"",fr:""},
    desc:{ar:"",en:"",fr:""}
  } */
];

const ui={
ar:{eyebrow:"اختيارات منتقاة بعناية",headline:"الفخامة في التفاصيل",subhead:"اكتشف منتجات عملية بتصميم أنيق وأسعار واضحة، مع تجربة تسوق بسيطة وآمنة.",sectionTitle:"اختيار الأسبوع",margin:"سعر عرض مقترح — السعر النهائي للمورد والشحن يحتاجان إلى تأكيد.",add:"أضف إلى السلة",supplier:"صفحة المورد على AliExpress ↗",notice:"تنبيه: سعر المورد المرجعي الذي تم العثور عليه سابقاً هو 2.39$ وقد يتغير. سعر العرض 3.99$ يعطي هامشاً إجمالياً نظرياً 1.60$ قبل الشحن والرسوم. تحقق من السعر والتوفر والشحن إلى الجزائر قبل تأكيد أي طلب. هذا المتجر لا يعالج مدفوعات البطاقات.",cartTitle:"سلة التسوق",totalLabel:"المجموع:",cartNote:"هذه سلة تجريبية؛ تواصل مع المتجر لتأكيد السعر والتوصيل قبل الشراء.",continue:"متابعة التسوق",empty:"السلة فارغة"},
en:{eyebrow:"Carefully selected finds",headline:"Luxury in the details",subhead:"Discover practical products with elegant design, clear pricing and a simple shopping experience.",sectionTitle:"Weekly pick",margin:"Suggested display price — confirm supplier price and shipping before ordering.",add:"Add to cart",supplier:"View supplier on AliExpress ↗",notice:"Note: the previously found supplier reference price was $2.39 and may change. The $3.99 display price gives a theoretical gross margin of $1.60 before shipping and fees. Confirm price, stock and shipping to Algeria before accepting an order. This store does not process card payments.",cartTitle:"Shopping cart",totalLabel:"Total:",cartNote:"Demo cart only. Contact the store to confirm price and delivery before purchase.",continue:"Continue shopping",empty:"Your cart is empty"},
fr:{eyebrow:"Sélection soigneusement choisie",headline:"Le luxe dans les détails",subhead:"Découvrez des produits pratiques au design élégant, avec des prix clairs et une expérience simple.",sectionTitle:"Le choix de la semaine",margin:"Prix affiché suggéré — confirmez le prix fournisseur et la livraison avant commande.",add:"Ajouter au panier",supplier:"Voir le fournisseur sur AliExpress ↗",notice:"Note : le prix fournisseur de référence trouvé précédemment était de 2,39 $ et peut changer. Le prix affiché de 3,99 $ donne une marge brute théorique de 1,60 $ avant livraison et frais. Vérifiez le prix, le stock et la livraison vers l'Algérie avant toute commande. Le site ne traite pas les paiements par carte.",cartTitle:"Panier",totalLabel:"Total :",cartNote:"Panier de démonstration. Contactez le magasin pour confirmer le prix et la livraison avant achat.",continue:"Continuer",empty:"Votre panier est vide"}
};

let lang="ar";
const cart={}; // id -> quantité
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderProducts(){
  const t=ui[lang];
  $("products").innerHTML=products.map(p=>`
    <article class="card">
      <div class="visual"><img src="${esc(p.img)}" alt="${esc(p.name[lang])}" loading="lazy"></div>
      <div class="info">
        <div class="tag">${esc(p.tag[lang])}</div>
        <h3>${esc(p.name[lang])}</h3>
        <p class="muted">${esc(p.desc[lang])}</p>
        <div class="price">US $${p.price.toFixed(2)}</div>
        <div class="muted">${esc(t.margin)}</div>
        <div class="actions">
          <button class="gold" data-add="${esc(p.id)}">${esc(t.add)}</button>
          ${p.supplier?`<a href="${esc(p.supplier)}" target="_blank" rel="noopener">${esc(t.supplier)}</a>`:""}
        </div>
      </div>
    </article>`).join("");
}

function renderCart(){
  const t=ui[lang];
  let count=0,total=0,html="";
  products.forEach(p=>{
    const q=cart[p.id]||0; if(!q) return;
    count+=q; total+=q*p.price;
    html+=`<div class="cartline">
      <img src="${esc(p.img)}" alt="">
      <span class="nm">${esc(p.name[lang])}</span>
      <span class="qtybox"><button data-dec="${esc(p.id)}">−</button><strong>${q}</strong><button data-inc="${esc(p.id)}">+</button></span>
    </div>`;
  });
  $("cartLines").innerHTML=html||`<p class="muted">${esc(t.empty)}</p>`;
  $("cartCount").textContent=count;
  $("total").textContent="$"+total.toFixed(2);
}

function renderLang(){
  const t=ui[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t[el.dataset.i18n]);
  renderProducts();renderCart();
}

$("lang").addEventListener("change",e=>{lang=e.target.value;renderLang()});
$("theme").addEventListener("click",()=>document.body.classList.toggle("light"));
$("products").addEventListener("click",e=>{
  const id=e.target.dataset.add; if(!id) return;
  cart[id]=(cart[id]||0)+1; renderCart();
});
$("cartLines").addEventListener("click",e=>{
  const inc=e.target.dataset.inc, dec=e.target.dataset.dec;
  if(inc) cart[inc]=(cart[inc]||0)+1;
  if(dec){cart[dec]=(cart[dec]||0)-1; if(cart[dec]<=0) delete cart[dec];}
  renderCart();
});
$("cartBtn").addEventListener("click",()=>$("cart").classList.add("open"));
$("close").addEventListener("click",()=>$("cart").classList.remove("open"));
$("continue").addEventListener("click",()=>$("cart").classList.remove("open"));
renderLang();
</script>
</body>
</html>
