{k:"makeup",c:4,n:{ar:"طقم مكياج 12 قطعة",en:"12-piece Makeup Set",fr:"Set maquillage 12 pièces"},p:9.99,o:29,s:7300,d:{ar:"طقم مكياج متكامل من 12 قطعة يضم أحمر شفاه وباليت ألوان وفرش، مناسب للاستخدام اليومي وللمناسبات.",en:"A complete 12-piece makeup set with lipstick, a color palette and brushes. Good for everyday looks and special occasions."},sp:{ar:"عدد القطع: 12|يناسب: جميع أنواع البشرة|المحتويات: أحمر شفاه، باليت، فرش|الاستخدام: يومي ومناسبات",en:"Pieces: 12|Suitable for: all skin types|Includes: lipstick, palette, brushes|Use: daily and occasions"}},

let remote=[],P=norm([...(LS("aura_hs",0)?[]:F),...mine]);
const X={
ar:{shipM:"طريقة الشحن",s_std:"شحن عادي",s_exp:"شحن سريع",s_pri:"شحن ممتاز",days:"يوم",free:"مجاني",sub:"المجموع الفرعي",shipC:"الشحن",badCard:"رقم البطاقة غير صحيح",buyNow:"اشترِ الآن",descL:"وصف المنتج",specL:"الخصائص"},
en:{shipM:"Shipping method",s_std:"Standard shipping",s_exp:"Express shipping",s_pri:"Priority shipping",days:"days",free:"Free",sub:"Subtotal",shipC:"Shipping",badCard:"Invalid card number",buyNow:"Buy now",descL:"Description",specL:"Specifications"},
fr:{shipM:"Mode de livraison",s_std:"Livraison standard",s_exp:"Livraison express",s_pri:"Livraison prioritaire",days:"jours",free:"Gratuit",sub:"Sous-total",shipC:"Livraison",badCard:"Numéro de carte invalide",buyNow:"Acheter",descL:"Description",specL:"Caractéristiques"}};
for(const k in X)Object.assign(T[k],X[k]);
const SHIP=[{id:"std",d:"15-25",p:2.99,free:50},{id:"exp",d:"7-12",p:6.99},{id:"pri",d:"3-7",p:14.99}];
let L="ar",cat=0,cart={},qs="",shSel="std",sub=0,cur=null;
const $=s=>document.querySelector(s),t=k=>T[L][k];
const money=v=>"$"+v.toFixed(2);
function render(){
document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
$("#cats").innerHTML=t("c").map((c,i)=>`<span class="${i==cat?"on":""}" data-c="${i}">${c}</span>`).join("");
const list=P.filter(x=>(!cat||x.c==cat)&&nm(x).toLowerCase().includes(qs));
$("#grid").innerHTML=list.map(x=>`<div class="p"><div class="im" data-v="${x.id}"><img src="${x.imgs[0]}" alt="${esc(nm(x))}" loading="lazy" onerror="this.onerror=null;this.src=art('box',0)" style="width:100%;height:100%;object-fit:cover"><em>-${Math.round((1-x.p/x.o)*100)}%</em></div><div class="bd"><h3 data-v="${x.id}">${nm(x)}</h3><div class="pr">${money(x.p)}<s>${money(x.o)}</s></div><div class="mu">${t("sold")} ${(x.s||0).toLocaleString()}+</div><button class="add" data-a="${x.id}">${t("add")}</button></div></div>`).join("");
$("#hi").innerHTML=`<img src="${art("bag",1)}" alt="" style="width:110px;height:110px;border-radius:18px">`;fillBadges();renderSh();cartUI()}
function cartUI(){
const ids=Object.keys(cart);let sum=0,n=0;
$("#items").innerHTML=ids.length?ids.map(i=>{const x=P.find(y=>y.id==i);if(!x)return"";const q=cart[i];sum+=x.p*q;n+=q;return`<div class="row"><img src="${x.imgs[0]}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px"><div>${nm(x)}<br><b style="color:var(--or)">${money(x.p)}</b></div><button data-d="${i}">−</button><b>${q}</b><button data-u="${i}">+</button></div>`}).join(""):`<p class="mu">${t("empty")}</p>`;
$("#cn").textContent=n;$("#tot").textContent=money(sum);sub=sum;calc();$("#go").disabled=!n;$("#go").style.opacity=n?1:.5}
document.addEventListener("click",e=>{const d=e.target.dataset;
if(d.a!==undefined){cart[d.a]=(cart[d.a]||0)+1;cartUI()}
if(d.u!==undefined){cart[d.u]++;cartUI()}
if(d.d!==undefined){if(--cart[d.d]<=0)delete cart[d.d];cartUI()}
if(d.c!==undefined){cat=+d.c;render()}
const vv=e.target.closest("[data-v]");if(vv)showP(vv.dataset.v);
const gg=e.target.closest("[data-g]");if(gg&&cur){$("#big").innerHTML=bg(cur.imgs[gg.dataset.g],cur);document.querySelectorAll("[data-g]").forEach(z=>z.classList.toggle("on",z==gg))}
if(d.bn!==undefined){cart[d.bn]=(cart[d.bn]||0)+1;cartUI();document.querySelectorAll(".ov").forEach(o=>o.classList.remove("on"));$("#cov").classList.add("on")}
if(d.ad)adminAct(d);
if(e.target.closest("[data-close]")||e.target.classList.contains("ov"))document.querySelectorAll(".ov").forEach(o=>o.classList.remove("on"))});
$("#cb").onclick=()=>$("#cov").classList.add("on");
$("#go").onclick=()=>{$("#cov").classList.remove("on");$("#pov").classList.add("on")};
$("#lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("aura_lang",L)}catch(_){}render()};
$("#q").oninput=e=>{qs=e.target.value.toLowerCase();render()};
document.querySelectorAll("[name=pm]").forEach(r=>r.onchange=()=>$("#card").style.display=r.value=="card"?"grid":"none");
$("#pay").onclick=async()=>{if(!$("#nm").value||!$("#ph").value||!$("#ad").value)return alert(t("fill"));
if(document.querySelector("[name=pm]:checked").value=="card"&&!luhn($("#cn1").value))return alert(t("badCard"));
const items=Object.keys(cart).map(id=>{const x=P.find(y=>y.id==id);return{id,aliId:x.aliId,qty:cart[id],price:x.p,cost:x.cost,title:nm(x)}});
const order={customer:{name:$("#nm").value,phone:$("#ph").value,address:$("#ad").value},payment:document.querySelector("[name=pm]:checked").value,items,shipping:calc().opt.id,shipCost:calc().ship,total:calc().grand};
if(CFG.WA)window.open("https://wa.me/"+CFG.WA+"?text="+encodeURIComponent("🛒 AURA IMPEX\n"+order.customer.name+" | "+order.customer.phone+"\n"+order.customer.address+"\n"+items.map(i=>i.title+" x"+i.qty+" (AliExpress "+i.aliId+")").join("\n")+"\n$"+order.total.toFixed(2)+" - "+order.payment));
try{if(!CFG.API)throw 0;const r=await fetch(CFG.API+"/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)});if(!r.ok)throw 0}
catch(_){const q=LS("aura_orders",[]);q.push({...order,at:new Date().toLocaleString(),done:false});SV("aura_orders",q)}
alert(t("ok"));cart={};$("#pov").classList.remove("on");cartUI()};
async function load(){try{const r=await fetch(CFG.API?CFG.API+"/api/products":"products.json",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(d.length){remote=d;setP()}}catch(_){}}
// countdown
let end=Date.now()+6*3600e3;
setInterval(()=>{let r=Math.max(0,end-Date.now())/1e3|0;
$("#h").textContent=String(r/3600|0).padStart(2,0);$("#m").textContent=String(r/60%60|0).padStart(2,0);$("#s").textContent=String(r%60).padStart(2,0)},1000);
const BG=["VISA","Mastercard","AMEX","PayPal","Apple Pay","Google Pay"].map(b=>`<span class="bg">${b}</span>`).join("");
function fillBadges(){document.querySelectorAll(".badges").forEach(e=>e.innerHTML=BG)}
const bg=u=>`<img src="${u}" alt="" onerror="this.onerror=null;this.src=art('box',0)">`;
function renderSh(){$("#shl").innerHTML=SHIP.map(o=>`<label class="pay"><input type="radio" name="sh" value="${o.id}" ${o.id==shSel?"checked":""}>🚚 <span>${t("s_"+o.id)}<br><small class="mu">${o.d} ${t("days")}</small></span><b style="margin-inline-start:auto;text-align:end">${o.p?money(o.p):t("free")}${o.free?`<br><small class="mu">${t("free")} ≥ $${o.free}</small>`:""}</b></label>`).join("")}
function calc(){const o=SHIP.find(z=>z.id==shSel),ship=o.free&&sub>=o.free?0:o.p;$("#sb").textContent=money(sub);$("#sc").textContent=ship?money(ship):t("free");$("#tot2").textContent=money(sub+ship);return{opt:o,ship,grand:sub+ship}}
addEventListener("change",e=>{if(e.target.name=="sh"){shSel=e.target.value;calc()}});
function showP(id){const x=P.find(y=>y.id==id);if(!x)return;cur=x;const im=x.imgs;
$("#pd").innerHTML=`<button class="x" data-close>✕</button><div class="big" id="big">${bg(im[0],x)}</div>${im.length>1?`<div class="th">${im.map((u,i)=>`<span data-g="${i}" class="${i?"":"on"}"><img src="${u}" alt=""></span>`).join("")}</div>`:""}<h2 style="margin:6px 0">${nm(x)}</h2><div class="pr">${money(x.p)}<s>${money(x.o)}</s></div><div class="mu">${t("sold")} ${(x.s||0).toLocaleString()}+</div>${info(x)}${SHIP.map(o=>`<div class="mu">🚚 ${t("s_"+o.id)} · ${o.d} ${t("days")} · ${o.p?money(o.p):t("free")}</div>`).join("")}<div class="badges"></div><button class="add" style="padding:10px" data-a="${x.id}">${t("add")}</button><button class="main" data-bn="${x.id}">${t("buyNow")}</button>`;
fillBadges();$("#dov").classList.add("on")}
const luhn=v=>{v=v.replace(/\D/g,"");if(v.length<13)return false;let s=0,a=0;for(let i=v.length-1;i>=0;i--){let n=+v[i];if(a){n*=2;if(n>9)n-=9}s+=n;a=!a}return s%10==0};
$("#cn1").oninput=e=>{const v=e.target.value.replace(/\D/g,"").slice(0,16);e.target.value=v.replace(/(.{4})/g,"$1 ").trim();$("#brand").textContent=/^4/.test(v)?"VISA":/^(5[1-5]|2[2-7])/.test(v)?"Mastercard":/^3[47]/.test(v)?"AMEX":/^6/.test(v)?"Discover":""};
const rs=f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};im.onerror=()=>res(null);im.src=fr.result};fr.readAsDataURL(f)});
function admin(){const o=LS("aura_orders",[]);
$("#ap").innerHTML=`<h3>➕ إضافة منتج من AliExpress</h3><div style="display:grid;gap:6px;margin:8px 0"><input class="in" id="a1" placeholder="رابط المنتج أو رقمه"><input class="in" id="a2" placeholder="اسم المنتج"><textarea class="in" id="a3" rows="3" placeholder="روابط الصور (رابط في كل سطر)"></textarea><input class="in" id="a6" type="file" accept="image/*" multiple><input class="in" id="a4" type="number" step="0.01" placeholder="سعره في AliExpress بالدولار"><select class="in" id="a5">${t("c").slice(1).map((c,i)=>`<option value="${i+1}">${c}</option>`).join("")}</select><textarea class="in" id="a7" rows="3" placeholder="وصف المنتج"></textarea><textarea class="in" id="a8" rows="4" placeholder="الخصائص: سطر لكل خاصية مثل&#10;اللون: أسود&#10;الوزن: 200 غ"></textarea><button class="main" data-ad="add">إضافة للمتجر</button></div>
<h3>📦 منتجاتي (${mine.length})</h3><button class="cartbtn" style="border:1px solid var(--bd)" data-ad="hs">${LS("aura_hs",0)?"إظهار":"إخفاء"} المنتجات التجريبية</button>${mine.map(x=>`<div class="row"><div>${esc(nm(x))}<br><span class="mu">AliExpress $${x.cost} ← متجرك $${(x.cost+mk(x.cost)).toFixed(2)} (ربحك $${mk(x.cost)})</span></div><button data-ad="del" data-id="${x.id}">✕</button></div>`).join("")}
<h3>🧾 الطلبات (${o.length})</h3>${o.map((q,i)=>`<div class="row" style="align-items:flex-start;opacity:${q.done?0.5:1}"><div><b>${esc(q.customer.name)}</b> · ${esc(q.customer.phone)}<br>${esc(q.customer.address)}<br>${q.items.map(it=>`<a href="https://www.aliexpress.com/item/${esc(it.aliId)}.html" target="_blank" rel="noopener">${esc(it.title)} ×${it.qty}</a>`).join("<br>")}<br><span class="mu">$${q.total.toFixed(2)} · ${esc(q.payment)} · ربحك $${q.items.reduce((a,it)=>a+(it.price-(it.cost||0))*it.qty,0).toFixed(2)}</span></div><button data-ad="done" data-i="${i}">${q.done?"↩":"✔"}</button></div>`).join("")}`}
async function adminAct(d){
if(d.ad=="add"){const id=($("#a1").value.match(/\d{8,}/)||[])[0],c=parseFloat($("#a4").value);if(!id||!(c>0))return alert("أدخل رابط/رقم المنتج وسعره");
const imgs=$("#a3").value.split(/\s+/).filter(u=>/^https?:/.test(u));for(const f of $("#a6").files){const u=await rs(f);if(u)imgs.push(u)}
mine.push({id:"m"+Date.now(),aliId:id,n:$("#a2").value||"Product",imgs,d:$("#a7").value.trim(),sp:$("#a8").value.trim(),cost:c,c:+$("#a5").value});if(!SV("aura_products",mine))alert("الذاكرة ممتلئة: قلّل عدد الصور");setP()}
if(d.ad=="hs"){SV("aura_hs",LS("aura_hs",0)?0:1);setP()}
if(d.ad=="del"){mine=mine.filter(x=>x.id!=d.id);SV("aura_products",mine);setP()}
if(d.ad=="done"){const o=LS("aura_orders",[]);o[d.i].done=!o[d.i].done;SV("aura_orders",o)}
admin()}
function openAdmin(){if(location.hash!="#admin")return;if(CFG.PASS&&prompt("Password")!=CFG.PASS){location.hash="";return}admin();$("#aov").classList.add("on")}
try{const s=localStorage.getItem("aura_lang");if(T[s])L=s}catch(_){}
$("#lang").value=L;render();load();setInterval(load,CFG.REFRESH);addEventListener("hashchange",openAdmin);openAdmin();
</script>
</body>
