<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA IMPEX</title>
<style>
:root{--or:#ff4747;--or2:#ff7a1a;--bg:#f5f5f5;--card:#fff;--tx:#191919;--mu:#757575;--bd:#e6e6e6}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mu:#a0a0a0;--bd:#333}}
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
button,input,select{font:inherit;color:inherit}
.top{background:#222;color:#ddd;font-size:12px;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top select{background:#333;border:1px solid #555;border-radius:6px;padding:3px 8px;color:#fff}
header{background:linear-gradient(90deg,var(--or),var(--or2));padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:22px;color:#fff;letter-spacing:1px;white-space:nowrap}
.search{flex:1;min-width:200px;display:flex;background:#fff;border-radius:30px;overflow:hidden;border:2px solid #fff}
.search input{flex:1;border:0;padding:9px 16px;outline:0;background:#fff;color:#191919}
.search button{border:0;background:#191919;color:#fff;padding:0 20px;cursor:pointer}
.cartbtn{background:#fff;color:var(--or);border:0;border-radius:30px;padding:9px 16px;font-weight:700;cursor:pointer}
.cartbtn b{background:var(--or);color:#fff;border-radius:20px;padding:0 8px;margin-inline-start:4px}
.wrap{max-width:1200px;margin:auto;padding:12px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.cats span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;white-space:nowrap;cursor:pointer}
.cats span.on,.cats span:hover{border-color:var(--or);color:var(--or)}
.hero{background:linear-gradient(120deg,#ff4747,#ff9a1a);color:#fff;border-radius:14px;padding:28px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero h1{font-size:clamp(22px,4vw,36px)}
.hero p{opacity:.95;margin-top:4px}
.hero .em{font-size:64px}
.cd{display:flex;gap:6px;margin-top:10px}
.cd i{font-style:normal;background:#191919;border-radius:6px;padding:3px 9px;font-weight:700;font-variant-numeric:tabular-nums}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.feat div{background:var(--card);border-radius:10px;padding:10px;font-size:13px;text-align:center}
h2{margin:14px 0 8px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.p{background:var(--card);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.p .im{height:150px;display:grid;place-items:center;font-size:72px;background:linear-gradient(135deg,#fff1e6,#ffe0e0);position:relative}
.p .im em{position:absolute;top:8px;inset-inline-start:8px;background:var(--or);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px}
.p .bd{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.p h3{font-size:14px;font-weight:500}
.pr{color:var(--or);font-size:19px;font-weight:800}
.pr s{color:var(--mu);font-size:12px;font-weight:400;margin-inline-start:6px}
.mu{color:var(--mu);font-size:12px}
.add{margin-top:auto;border:0;background:var(--or);color:#fff;border-radius:20px;padding:7px;cursor:pointer;font-weight:700}
.add:hover{background:#e03030}
.ov{position:fixed;inset:0;background:#0008;display:none;z-index:20}
.ov.on{display:block}
.dr{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--card);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,94%);max-height:92vh;overflow:auto;background:var(--card);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding:8px 0}
.row .e{font-size:30px}.row div{flex:1;font-size:14px}
.row button{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:none;cursor:pointer}
.in{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.pay{display:flex;align-items:center;gap:8px;border:1.5px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}
.pay:has(input:checked){border-color:var(--or);background:#ff47470d}
.main{border:0;background:var(--or);color:#fff;border-radius:30px;padding:12px;font-weight:800;cursor:pointer;font-size:16px}
.x{align-self:flex-end;background:none;border:0;font-size:22px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px}
#card{display:grid;grid-template-columns:1fr 1fr;gap:8px}#card .in:first-child{grid-column:1/3}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
</style>
</head>
<body>
<div class="top"><span data-i="ship"></span>
<label><span data-i="lang"></span>
<select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option></select></label></div>
<header>
<div class="logo">AURA IMPEX</div>
<div class="search"><input id="q" data-ph="search"><button data-i="searchBtn"></button></div>
<button class="cartbtn" id="cb">🛒 <span data-i="cart"></span><b id="cn">0</b></button>
</header>
<div class="wrap">
<div class="cats" id="cats"></div>
<div class="hero"><div><h1 data-i="hero"></h1><p data-i="heroSub"></p>
<div class="cd"><i id="h">00</i><i id="m">00</i><i id="s">00</i></div></div><div class="em">🛍️</div></div>
<div class="feat"><div data-i="f1"></div><div data-i="f2"></div><div data-i="f3"></div><div data-i="f4"></div></div>
<h2 data-i="deals"></h2>
<div class="grid" id="grid"></div>
</div>
<footer>© 2026 AURA IMPEX</footer>

<div class="ov" id="cov"><div class="dr"><button class="x" data-close>✕</button><h2 data-i="cart"></h2><div id="items"></div>
<div class="tot"><span data-i="total"></span><span id="tot"></span></div>
<button class="main" id="go" data-i="checkout"></button></div></div>

<div class="ov" id="pov"><div class="mo"><button class="x" data-close>✕</button><h2 data-i="checkout"></h2>
<input class="in" id="nm" data-ph="name"><input class="in" id="ph" data-ph="phone" type="tel"><input class="in" id="ad" data-ph="addr">
<b data-i="payM"></b>
<label class="pay"><input type="radio" name="pm" value="card" checked>💳 <span data-i="pCard"></span></label>
<div id="card"><input class="in" placeholder="1234 5678 9012 3456" inputmode="numeric" maxlength="19"><input class="in" placeholder="MM/YY" maxlength="5"><input class="in" placeholder="CVV" maxlength="4"></div>
<label class="pay"><input type="radio" name="pm" value="pp">🅿️ PayPal</label>
<label class="pay"><input type="radio" name="pm" value="cod">💵 <span data-i="pCod"></span></label>
<label class="pay"><input type="radio" name="pm" value="bank">🏦 <span data-i="pBank"></span></label>
<div class="tot"><span data-i="total"></span><span id="tot2"></span></div>
<button class="main" id="pay" data-i="payNow"></button></div></div>

<script>
const T={
ar:{ship:"🚚 شحن مجاني للطلبات فوق 50$",lang:"اللغة:",search:"ابحث عن منتج...",searchBtn:"بحث",cart:"السلة",hero:"عروض فلاش · خصومات حتى 70%",heroSub:"تنتهي العروض خلال",f1:"🛡️ حماية المشتري",f2:"🚚 شحن سريع",f3:"↩️ إرجاع خلال 15 يوم",f4:"🔒 دفع آمن",deals:"عروض اليوم",add:"أضف للسلة",sold:"تم بيع",empty:"السلة فارغة",total:"الإجمالي",checkout:"إتمام الشراء",name:"الاسم الكامل",phone:"رقم الهاتف",addr:"العنوان",payM:"طريقة الدفع",pCard:"بطاقة بنكية",pCod:"الدفع عند الاستلام",pBank:"تحويل بنكي",payNow:"ادفع الآن",ok:"✅ تم استلام طلبك بنجاح! شكراً لتسوقك من AURA IMPEX",fill:"أكمل الاسم والهاتف والعنوان",all:"الكل",c:["الكل","إلكترونيات","أزياء","المنزل","جمال"]},
en:{ship:"🚚 Free shipping on orders over $50",lang:"Language:",search:"Search for products...",searchBtn:"Search",cart:"Cart",hero:"Flash Deals · Up to 70% off",heroSub:"Deals end in",f1:"🛡️ Buyer protection",f2:"🚚 Fast shipping",f3:"↩️ 15-day returns",f4:"🔒 Secure payment",deals:"Today's deals",add:"Add to cart",sold:"sold",empty:"Your cart is empty",total:"Total",checkout:"Checkout",name:"Full name",phone:"Phone number",addr:"Address",payM:"Payment method",pCard:"Credit / debit card",pCod:"Cash on delivery",pBank:"Bank transfer",payNow:"Pay now",ok:"✅ Order received! Thank you for shopping at AURA IMPEX",fill:"Please fill in name, phone and address",c:["All","Electronics","Fashion","Home","Beauty"]},
fr:{ship:"🚚 Livraison gratuite dès 50$",lang:"Langue :",search:"Rechercher un produit...",searchBtn:"Chercher",cart:"Panier",hero:"Ventes flash · Jusqu'à -70%",heroSub:"Fin des offres dans",f1:"🛡️ Protection acheteur",f2:"🚚 Livraison rapide",f3:"↩️ Retour sous 15 jours",f4:"🔒 Paiement sécurisé",deals:"Offres du jour",add:"Ajouter",sold:"vendus",empty:"Votre panier est vide",total:"Total",checkout:"Commander",name:"Nom complet",phone:"Téléphone",addr:"Adresse",payM:"Mode de paiement",pCard:"Carte bancaire",pCod:"Paiement à la livraison",pBank:"Virement bancaire",payNow:"Payer maintenant",ok:"✅ Commande reçue ! Merci d'avoir acheté chez AURA IMPEX",fill:"Renseignez nom, téléphone et adresse",c:["Tout","Électronique","Mode","Maison","Beauté"]}};
const P=[
{e:"🎧",c:1,n:{ar:"سماعات بلوتوث لاسلكية",en:"Wireless Bluetooth Earbuds",fr:"Écouteurs Bluetooth sans fil"},p:12.99,o:39.9,s:5400},
{e:"⌚",c:1,n:{ar:"ساعة ذكية رياضية",en:"Sport Smart Watch",fr:"Montre connectée sport"},p:24.5,o:79,s:3200},
{e:"👟",c:2,n:{ar:"حذاء رياضي خفيف",en:"Lightweight Sneakers",fr:"Baskets légères"},p:19.9,o:55,s:2100},
{e:"👜",c:2,n:{ar:"حقيبة يد أنيقة",en:"Stylish Handbag",fr:"Sac à main élégant"},p:15.75,o:48,s:1800},
{e:"💡",c:3,n:{ar:"إضاءة LED ذكية",en:"Smart LED Lamp",fr:"Lampe LED intelligente"},p:8.4,o:22,s:6900},
{e:"☕",c:3,n:{ar:"ماكينة قهوة صغيرة",en:"Mini Coffee Maker",fr:"Mini cafetière"},p:29,o:69,s:950},
{e:"💄",c:4,n:{ar:"طقم مكياج 12 قطعة",en:"12-piece Makeup Set",fr:"Set maquillage 12 pièces"},p:9.99,o:29,s:7300},
{e:"📱",c:1,n:{ar:"حامل هاتف للسيارة",en:"Car Phone Holder",fr:"Support téléphone voiture"},p:3.5,o:12,s:12000}];
let L="ar",cat=0,cart={},qs="";
const $=s=>document.querySelector(s),t=k=>T[L][k];
const money=v=>"$"+v.toFixed(2);
function render(){
document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
$("#cats").innerHTML=t("c").map((c,i)=>`<span class="${i==cat?"on":""}" data-c="${i}">${c}</span>`).join("");
const list=P.map((x,i)=>({...x,i})).filter(x=>(!cat||x.c==cat)&&x.n[L].toLowerCase().includes(qs));
$("#grid").innerHTML=list.map(x=>`<div class="p"><div class="im">${x.e}<em>-${Math.round((1-x.p/x.o)*100)}%</em></div><div class="bd"><h3>${x.n[L]}</h3><div class="pr">${money(x.p)}<s>${money(x.o)}</s></div><div class="mu">${t("sold")} ${x.s.toLocaleString()}+</div><button class="add" data-a="${x.i}">${t("add")}</button></div></div>`).join("");
cartUI()}
function cartUI(){
const ids=Object.keys(cart);let sum=0,n=0;
$("#items").innerHTML=ids.length?ids.map(i=>{const x=P[i],q=cart[i];sum+=x.p*q;n+=q;return`<div class="row"><span class="e">${x.e}</span><div>${x.n[L]}<br><b style="color:var(--or)">${money(x.p)}</b></div><button data-d="${i}">−</button><b>${q}</b><button data-u="${i}">+</button></div>`}).join(""):`<p class="mu">${t("empty")}</p>`;
$("#cn").textContent=n;$("#tot").textContent=$("#tot2").textContent=money(sum);$("#go").disabled=!n;$("#go").style.opacity=n?1:.5}
document.addEventListener("click",e=>{const d=e.target.dataset;
if(d.a!==undefined){cart[d.a]=(cart[d.a]||0)+1;cartUI()}
if(d.u!==undefined){cart[d.u]++;cartUI()}
if(d.d!==undefined){if(--cart[d.d]<=0)delete cart[d.d];cartUI()}
if(d.c!==undefined){cat=+d.c;render()}
if(e.target.closest("[data-close]")||e.target.classList.contains("ov"))document.querySelectorAll(".ov").forEach(o=>o.classList.remove("on"))});
$("#cb").onclick=()=>$("#cov").classList.add("on");
$("#go").onclick=()=>{$("#cov").classList.remove("on");$("#pov").classList.add("on")};
$("#lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("aura_lang",L)}catch(_){}render()};
$("#q").oninput=e=>{qs=e.target.value.toLowerCase();render()};
document.querySelectorAll("[name=pm]").forEach(r=>r.onchange=()=>$("#card").style.display=r.value=="card"?"grid":"none");
$("#pay").onclick=()=>{if(!$("#nm").value||!$("#ph").value||!$("#ad").value)return alert(t("fill"));
alert(t("ok"));cart={};$("#pov").classList.remove("on");cartUI()};
// countdown
let end=Date.now()+6*3600e3;
setInterval(()=>{let r=Math.max(0,end-Date.now())/1e3|0;
$("#h").textContent=String(r/3600|0).padStart(2,0);$("#m").textContent=String(r/60%60|0).padStart(2,0);$("#s").textContent=String(r%60).padStart(2,0)},1000);
try{const s=localStorage.getItem("aura_lang");if(T[s])L=s}catch(_){}
$("#lang").value=L;render();
</script>
</body>
</html>
